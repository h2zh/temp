<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <script src="boot.js"></script>
  <meta name="color-scheme" content="light">
  <title data-i18n="stylized.docTitle">卡通地标 · Crowd3D 众拍建模</title>
  <meta name="description" content="按开放地图数据搭出、用打卡照片校正尺寸的卡通素模地标，不上色。" data-i18n-content="stylized.metaDescription">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cpath d='M16 3 27 9v14l-11 6-11-6V9z' fill='%232f9e5b'/%3E%3Cpath d='M16 3v26M5 9l11 6 11-6' stroke='%23fff' stroke-width='2' fill='none'/%3E%3C/svg%3E">
  <style>
    :root {
      --sky-top: #8fd0ff;
      --sky-mid: #c9ecff;
      --sky-low: #fff6e4;
      --ink: #2d2a32;
      --card: rgba(255, 255, 255, 0.92);
      --green: #58b947;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; }
    body {
      font: 15px/1.4 "Nunito", "PingFang SC", "Noto Sans CJK SC", "WenQuanYi Zen Hei", system-ui, sans-serif;
      color: var(--ink);
      background: linear-gradient(180deg, var(--sky-top) 0%, var(--sky-mid) 55%, var(--sky-low) 100%);
      overflow: hidden;
    }
    #stage { position: fixed; inset: 0; touch-action: none; }
    #stage canvas { display: block; width: 100%; height: 100%; }
    .labels { position: absolute; inset: 0; pointer-events: none; }
    #panel {
      position: fixed; left: max(12px, env(safe-area-inset-left)); top: max(12px, env(safe-area-inset-top));
      max-width: min(360px, calc(100vw - 24px)); padding: 12px 14px; border-radius: 18px;
      background: var(--card); border: 3px solid var(--ink); box-shadow: 0 4px 0 var(--ink);
    }
    #panel h1 { margin: 0 0 6px; font-size: 18px; line-height: 1.25; }
    .chips { display: flex; flex-wrap: wrap; gap: 6px; margin: 0 0 6px; padding: 0; list-style: none; }
    .chips li { padding: 2px 10px; border-radius: 999px; font-weight: 700; font-size: 13px; border: 2px solid var(--ink); background: #fff; }
    .chips li[hidden] { display: none; }
    #panel p { margin: 2px 0; font-size: 12px; }
    #attribution p { color: #5b5763; font-size: 11px; }
    #panel .theme-row { display: flex; align-items: center; gap: 6px; margin: 6px 0 2px; font-size: 13px; font-weight: 700; }
    #panel .theme-row select { font: inherit; font-weight: 600; padding: 1px 6px; border-radius: 999px; border: 2px solid var(--ink);
      background: #fff; color: var(--ink); max-width: 60%; }
    #theme-note { color: #9a3b1f; }
    /* an English page stays hidden until stylized.js has translated it (boot.js, i18n.js applyDom) */
    html.i18n-pending body { visibility: hidden; }
    /* the display settings (ui.js mountPrefs, D32) */
    #prefs { margin: 6px 0 2px; }
    .prefs { display: flex; align-items: center; gap: 6px; }
    .pref { position: relative; display: inline-flex; align-items: center; }
    .pref-icon { position: absolute; left: 8px; display: inline-flex; pointer-events: none; }
    .pref-icon svg { stroke: var(--ink); }
    .pref select { font: inherit; font-size: 13px; font-weight: 600; padding: 1px 8px 1px 28px; border-radius: 999px;
      border: 2px solid var(--ink); background: #fff; color: var(--ink); }
    .visually-hidden { position: absolute !important; width: 1px; height: 1px; margin: -1px; padding: 0; overflow: hidden;
      clip: rect(0 0 0 0); clip-path: inset(50%); white-space: nowrap; border: 0; }
    #pick {
      position: fixed; right: max(12px, env(safe-area-inset-right)); bottom: max(12px, env(safe-area-inset-bottom));
      max-width: min(300px, calc(100vw - 24px)); padding: 10px 12px; border-radius: 14px;
      background: var(--card); border: 3px solid var(--ink); box-shadow: 0 4px 0 var(--ink); font-size: 13px;
    }
    #pick p { margin: 1px 0; }
    #pick p:first-child { font-weight: 800; }
    #status { position: fixed; left: 50%; top: 45%; transform: translate(-50%, -50%); padding: 12px 16px;
      border-radius: 14px; background: var(--card); border: 3px solid var(--ink); font-weight: 700; }
    body.no-ui #panel, body.no-ui #pick { display: none; }
    @media (max-width: 520px) {
      #panel { right: 12px; max-width: none; padding: 10px 12px; }
      #panel h1 { font-size: 16px; }
      #attribution { display: none; }
    }
  </style>
  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
      }
    }
  </script>
  <script type="module" src="stylized.js"></script>
</head>
<body>
  <main id="stage" aria-label="卡通风格三维地标模型，可拖动旋转、双指缩放，点按墙面查看来源" data-i18n-aria-label="stylized.stageLabel"></main>
  <section id="panel" hidden>
    <h1 id="title" data-i18n="stylized.landmark">地标</h1>
    <!-- the counts (stylized.js fillPanel) -->
    <ul class="chips">
      <li id="walls"></li>
      <li id="roof-faces"></li>
      <li id="relief-chip" hidden></li>
    </ul>
    <p data-i18n="stylized.about">素模按地图轮廓和高度搭出来，照片对齐时再用照片量出的尺寸校正，不上色。点按任意一块查看来源。</p>
    <p class="theme-row"><label for="theme-pick" data-i18n="stylized.theme.label">画风</label><select id="theme-pick" disabled><option data-i18n="themes.default.name">明快扁平</option></select></p>
    <p id="theme-note" hidden></p>
    <div id="prefs"></div>
    <div id="attribution"></div>
  </section>
  <aside id="pick" hidden></aside>
  <div id="status" hidden role="status"></div>
</body>
</html>
